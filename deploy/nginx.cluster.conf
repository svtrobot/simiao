# Load balancer for several 云上寺 instances (docs/CLUSTER.md).
# ip_hash keeps one visitor on one instance: their WebSocket room and their HTTP calls then read
# and write the same in-memory copy, so cross-instance write conflicts stay theoretical.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream simiao {
  ip_hash;
  server app-a:8787 max_fails=2 fail_timeout=5s;
  server app-b:8787 max_fails=2 fail_timeout=5s;
}

server {
  listen 80;
  client_max_body_size 256k;

  location / {
    proxy_pass http://simiao;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # behind a TLS terminator, pass its scheme through instead (passkeys check the origin)
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    # an instance that is down: try the other one
    proxy_next_upstream error timeout http_502 http_503;
  }
}
