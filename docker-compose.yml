# 本地或单机部署：docker compose up -d --build
services:
  simiao:
    build:
      context: .
      args:
        VENDOR_THREE: "false"   # 大陆部署改为 "true"，three.js 由本机提供
    image: simiao:latest
    restart: unless-stopped
    ports:
      - "8787:8787"             # 线上请改为 "127.0.0.1:8787:8787"，前面放 Caddy / Nginx 做 HTTPS
    environment:
      REGION: tw                # tw | overseas | cn
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}   # 在 .env 里设置长随机串以开启 /admin
      ROOM_CAPACITY: 100
      PAYMENTS: ${PAYMENTS:-}                     # 空 = 不贩售；stripe 需要下面两把密钥；sandbox 仅供本机测试
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}  # 线上填 https://你的域名（通行密钥绑定此域名，也是推播的联系方式）
      TZ: UTC                   # 提醒按每台设备自己的时区计算，与容器时区无关
    volumes:
      - simiao-data:/data
volumes:
  simiao-data:
